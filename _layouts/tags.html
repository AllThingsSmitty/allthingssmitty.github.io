---
layout: default
title: Tags
---
<div class="page">
  <header class="page-header">
    <h2 class="page-header__title page-header__title--md">Posts tagged &ldquo;{{ page.tag }}&rdquo;</h2>
  </header>
  <section class="tags flow">
    {% for post in site.tags[page.tag] %}
      <div class="tags__item">
        <a href="{{ post.url }}">{{ post.title | smartify }}</a>
        <time
          class="archive-date"
          aria-hidden="true"
          datetime="{{ post.date | date: '%B %-d, %Y' }}">
          <span
            aria-hidden="true"
            data-long="{{ post.date | date: '%B %-d, %Y' }}"
            data-short="{{ post.date | date: '%b %-d, %Y' }}"></span>
        </time>
      </div>
    {% endfor %}
  </section>
</div>
